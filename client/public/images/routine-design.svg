<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720">
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#e6efdc"/>
    <stop offset="1" stop-color="#f8f1df"/>
  </linearGradient>
  <linearGradient id="glass" x2="1">
    <stop stop-color="#a8c9a8"/>
    <stop offset=".5" stop-color="#e5f2dd"/>
    <stop offset="1" stop-color="#91b99a"/>
  </linearGradient>
</defs>
<rect width="800" height="720" rx="35" fill="url(#bg)"/>
<circle cx="110" cy="110" r="135" fill="#c5d9b5" opacity=".45"/>
<circle cx="735" cy="90" r="120" fill="#c0d4a7" opacity=".5"/>

<g fill="#76996b" opacity=".65">
  <ellipse cx="90" cy="170" rx="22" ry="55" transform="rotate(-40 90 170)"/>
  <ellipse cx="135" cy="110" rx="20" ry="55" transform="rotate(30 135 110)"/>
  <ellipse cx="710" cy="175" rx="22" ry="65" transform="rotate(40 710 175)"/>
  <ellipse cx="755" cy="250" rx="20" ry="60" transform="rotate(-35 755 250)"/>
</g>

<text x="400" y="80" text-anchor="middle" fill="#365d40"
 font-family="Arial,sans-serif" font-size="38" font-weight="bold">Your Daily Glow Ritual</text>
<text x="400" y="118" text-anchor="middle" fill="#66806a"
 font-family="Arial,sans-serif" font-size="19">Four simple steps to healthy skin</text>

<ellipse cx="400" cy="500" rx="345" ry="40" fill="#9caa91" opacity=".23"/>
<rect x="65" y="462" width="670" height="44" rx="16" fill="#dfd4bd"/>

<!-- Cleanser tube -->
<path d="M100 220 L235 220 L220 460 L115 460 Z" fill="#faf7ec" stroke="#c9c5b5" stroke-width="3"/>
<rect x="135" y="190" width="65" height="30" rx="7" fill="#e0d9c8"/>
<text x="168" y="315" text-anchor="middle" font-family="Arial" font-size="25" fill="#456e4b">Cleanse</text>
<text x="168" y="344" text-anchor="middle" font-family="Arial" font-size="15" fill="#809080">GENTLE WASH</text>

<!-- Toner bottle -->
<rect x="260" y="225" width="115" height="235" rx="18" fill="url(#glass)" stroke="#8fb393" stroke-width="3"/>
<rect x="285" y="182" width="65" height="45" rx="8" fill="#f7f5e9"/>
<rect x="275" y="295" width="85" height="95" rx="6" fill="#f6f8ee" opacity=".9"/>
<text x="317" y="342" text-anchor="middle" font-family="Arial" font-size="25" fill="#456e4b">Tone</text>

<!-- Serum dropper -->
<rect x="420" y="273" width="100" height="187" rx="15" fill="#e6c883" stroke="#c9ad6e" stroke-width="3"/>
<rect x="446" y="212" width="48" height="65" rx="8" fill="#f6f3e8"/>
<rect x="461" y="189" width="18" height="26" rx="8" fill="#c4c8b4"/>
<rect x="427" y="325" width="86" height="87" rx="6" fill="#fff8e9"/>
<text x="470" y="371" text-anchor="middle" font-family="Arial" font-size="25" fill="#456e4b">Treat</text>

<!-- Moisturizer jar -->
<rect x="560" y="325" width="155" height="135" rx="24" fill="#f8f5e9" stroke="#d6d1bf" stroke-width="3"/>
<rect x="550" y="294" width="175" height="43" rx="13" fill="#789b75"/>
<text x="637" y="393" text-anchor="middle" font-family="Arial" font-size="23" fill="#456e4b">Moisturize</text>

<rect x="40" y="552" width="720" height="125" rx="25" fill="#ffffff" opacity=".82"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#3c6245">
  <text x="120" y="605" font-size="23" font-weight="bold">01</text>
  <text x="120" y="638" font-size="19">Cleanse</text>
  <text x="300" y="605" font-size="23" font-weight="bold">02</text>
  <text x="300" y="638" font-size="19">Tone</text>
  <text x="480" y="605" font-size="23" font-weight="bold">03</text>
  <text x="480" y="638" font-size="19">Treat</text>
  <text x="665" y="605" font-size="23" font-weight="bold">04</text>
  <text x="665" y="638" font-size="19">Moisturize</text>
</g>
</svg>